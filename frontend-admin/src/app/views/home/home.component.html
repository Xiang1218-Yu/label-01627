<div class="home-view">
  <!-- 页面头部 -->
  <header class="page-header">
    <div class="page-header__content">
      <h1 class="page-header__title">{{ 'header.title' | translate }}</h1>
      <p class="page-header__desc">{{ 'header.description' | translate }}</p>
    </div>
    <button
      nz-button
      nzType="text"
      class="settings-btn"
      (click)="settingsVisible = true"
    >
      <i nz-icon nzType="setting" nzTheme="outline"></i>
    </button>
  </header>

  <!-- 主内容区 -->
  <main class="home-view__content container">
    <nz-row [nzGutter]="24">
      <!-- 左侧：文字输入 -->
      <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="14" [nzLg]="14">
        <app-text-input-card
          [text]="inputText"
          [loading]="generating"
          (textChange)="inputText = $event"
          (generate)="generateQrCode()"
        ></app-text-input-card>
      </nz-col>

      <!-- 右侧：二维码预览 -->
      <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="10" [nzLg]="10">
        <app-qr-preview-card
          [qrDataUrl]="qrDataUrl"
          [displayUrl]="displayUrl"
        ></app-qr-preview-card>
      </nz-col>
    </nz-row>

    <!-- 底部：网络信息 -->
    <div class="home-view__network">
      <app-network-info-card
        [localIP]="localIP"
        [port]="serverPort"
        (localIPChange)="handleIPUpdate($event)"
      ></app-network-info-card>
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="home-view__footer">
    <p>{{ 'footer.copyright' | translate }}</p>
  </footer>

  <!-- 设置抽屉 -->
  <nz-drawer
    [nzVisible]="settingsVisible"
    [nzTitle]="'settings.language' | translate"
    [nzPlacement]="'right'"
    [nzWidth]="320"
    (nzOnClose)="settingsVisible = false"
  >
    <div class="settings-content">
      <!-- 语言选择 -->
      <div class="settings-section">
        <h4 class="settings-section__title">{{ 'settings.language' | translate }}</h4>
        <div class="language-options">
          <button
            *ngFor="let lang of i18nService.supportedLanguages"
            nz-button
            [nzType]="i18nService.getCurrentLanguage() === lang.code ? 'primary' : 'default'"
            class="language-btn"
            (click)="changeLanguage(lang.code)"
          >
            {{ lang.nativeName }}
          </button>
        </div>
      </div>

      <!-- 主题颜色选择 -->
      <div class="settings-section">
        <h4 class="settings-section__title">{{ 'settings.themeColor' | translate }}</h4>
        <div class="color-preset">
          <div
            *ngFor="let preset of themeService.presetColors"
            class="color-option"
            [class.active]="themeService.getCurrentPrimaryColor() === preset.color"
            [style.backgroundColor]="preset.color"
            (click)="changeThemeColor(preset.color)"
          ></div>
        </div>
      </div>
    </div>
  </nz-drawer>
</div>
