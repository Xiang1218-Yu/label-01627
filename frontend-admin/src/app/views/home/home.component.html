<div class="home-view">
  <header class="page-header">
    <h1 class="page-header__title">{{ getTranslation('home.title') }}</h1>
    <p class="page-header__desc">{{ getTranslation('home.step1') }} → {{ getTranslation('home.step3') }} → {{ getTranslation('home.scanTip') }}</p>
  </header>

  <main class="home-view__content container">
    <nz-row [nzGutter]="24">
      <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="14" [nzLg]="14">
        <app-text-input-card
          [text]="inputText"
          [loading]="generating"
          [i18nService]="i18nService"
          (textChange)="inputText = $event"
          (generate)="generateQrCode()"
        ></app-text-input-card>
      </nz-col>

      <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="10" [nzLg]="10">
        <app-qr-preview-card
          [qrDataUrl]="qrDataUrl"
          [displayUrl]="displayUrl"
          [i18nService]="i18nService"
        ></app-qr-preview-card>
      </nz-col>
    </nz-row>

    <div class="home-view__network">
      <app-network-info-card
        [localIP]="localIP"
        [port]="serverPort"
        [i18nService]="i18nService"
        (localIPChange)="handleIPUpdate($event)"
      ></app-network-info-card>
    </div>
  </main>

  <footer class="home-view__footer">
    <p>QR Code Generator &copy; 2026</p>
  </footer>
</div>
