<div class="app-card qr-preview-card">
  <div class="app-card__title">
    <i nz-icon nzType="mobile" nzTheme="outline"></i>
    <span>{{ 'qrPreview.title' | translate }}</span>
  </div>

  <!-- 空状态 -->
  <div *ngIf="!qrDataUrl" class="qr-preview-card__empty">
    <i nz-icon nzType="picture" nzTheme="fill" class="empty-icon"></i>
    <p>{{ 'qrPreview.noQrCode' | translate }}</p>
    <p class="sub-text">{{ 'header.description' | translate }}</p>
  </div>

  <!-- 二维码展示 -->
  <div *ngIf="qrDataUrl" class="qr-preview-card__content">
    <div class="qr-image-wrapper">
      <img [src]="qrDataUrl" alt="QR Code" class="qr-image" />
      <div class="scan-hint">
        <i nz-icon nzType="mobile" nzTheme="outline"></i>
        <span>{{ 'messages.qrGenerated' | translate }}</span>
      </div>
    </div>

    <div class="qr-preview-card__info">
      <nz-alert
        nzType="success"
        [nzMessage]="'networkInfo.tip' | translate"
        nzShowIcon
        [nzCloseable]="false"
      ></nz-alert>
    </div>

    <div class="qr-preview-card__actions">
      <button nz-button nzType="primary" nzGhost (click)="handleDownload()">
        <i nz-icon nzType="download" nzTheme="outline"></i>
        {{ 'qrPreview.download' | translate }}
      </button>
      <button nz-button nzGhost (click)="handleCopy()">
        <i nz-icon nzType="copy" nzTheme="outline"></i>
        {{ 'qrPreview.copyLink' | translate }}
      </button>
    </div>
  </div>
</div>
