<div class="app-card text-input-card">
  <div class="app-card__title">
    <i nz-icon nzType="edit" nzTheme="outline"></i>
    <span>{{ 'home.inputPlaceholder' | translate }}</span>
  </div>
  <p class="app-card__subtitle">
    {{ 'home.inputPlaceholder' | translate }}
  </p>

  <nz-input-group class="text-input-card__textarea">
    <textarea
      nz-input
      [nzAutosize]="{ minRows: 6, maxRows: 12 }"
      [ngModel]="text"
      (ngModelChange)="onInput($event)"
      [placeholder]="'home.inputPlaceholder' | translate"
      maxlength="1000"
    ></textarea>
  </nz-input-group>
  <div class="word-count">{{ text.length }} / 1000</div>

  <div class="text-input-card__actions">
    <button
      nz-button
      nzType="primary"
      nzSize="large"
      [nzLoading]="loading"
      [disabled]="!text.trim()"
      (click)="onGenerate()"
    >
      <i *ngIf="!loading" nz-icon nzType="send" nzTheme="outline"></i>
      {{ loading ? ('home.generating' | translate) : ('home.generateButton' | translate) }}
    </button>

    <button
      nz-button
      nzSize="large"
      [disabled]="!text"
      (click)="onClear()"
    >
      <i nz-icon nzType="delete" nzTheme="outline"></i>
      {{ 'home.clear' | translate }}
    </button>
  </div>

  <!-- 快捷示例 -->
  <div class="text-input-card__examples">
    <span class="examples-label">{{ 'home.quickSamples' | translate }}：</span>
    <nz-tag
      *ngFor="let example of examples; index as i"
      class="example-tag"
      (click)="applyExample(example.text)"
    >
      {{ i + 1 }}
    </nz-tag>
  </div>
</div>
