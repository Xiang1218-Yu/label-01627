<div class="app-card text-input-card">
  <div class="app-card__title">
    <i nz-icon nzType="edit" nzTheme="outline"></i>
    <span>{{ getTranslation('textInput.title') }}</span>
  </div>
  <p class="app-card__subtitle">
    {{ getTranslation('textInput.subtitle') }}
  </p>

  <nz-input-group class="text-input-card__textarea">
    <textarea
      nz-input
      [nzAutosize]="{ minRows: 6, maxRows: 12 }"
      [ngModel]="text"
      (ngModelChange)="onInput($event)"
      [placeholder]="getTranslation('textInput.placeholder')"
      maxlength="1000"
    ></textarea>
  </nz-input-group>
  <div class="word-count">{{ getTranslation('textInput.wordCount', { current: text.length, max: 1000 }) }}</div>

  <div class="text-input-card__actions">
    <button
      nz-button
      nzType="primary"
      nzSize="large"
      [nzLoading]="loading"
      [disabled]="!text.trim()"
      (click)="onGenerate()"
    >
      <i *ngIf="!loading" nz-icon nzType="send" nzTheme="outline"></i>
      {{ loading ? getTranslation('textInput.generating') : getTranslation('textInput.generateButton') }}
    </button>

    <button
      nz-button
      nzSize="large"
      [disabled]="!text"
      (click)="onClear()"
    >
      <i nz-icon nzType="delete" nzTheme="outline"></i>
      {{ getTranslation('textInput.clearButton') }}
    </button>
  </div>

  <!-- 快捷示例 -->
  <div class="text-input-card__examples">
    <span class="examples-label">{{ getTranslation('textInput.quickExamples') }}</span>
    <nz-tag
      *ngFor="let example of examples"
      class="example-tag"
      (click)="applyExample(example.text)"
    >
      {{ example.label }}
    </nz-tag>
  </div>
</div>
